site_name: MiMinions
site_description: An agentic framework with pydantic_ai, MCP server support and vector memory
site_url: https://docs.miminions.ai
repo_url: https://github.com/MiMinions-ai/MiMinions
repo_name: MiMinions-ai/MiMinions

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Plus Jakarta Sans
    code: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - Agent: modules/agent.md
      - Memory: modules/memory.md
      - Context Builder: modules/context.md
      - Tools: modules/tools.md
      - CLI & Chat: modules/cli.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true
