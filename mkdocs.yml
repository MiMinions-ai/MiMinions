site_name: MiMinions
site_description: An agentic framework with pydantic_ai, MCP server support and vector memory
site_url: https://miminions.ai
repo_url: https://github.com/MiMinions-ai/MiMinions
repo_name: MiMinions-ai/MiMinions

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    logo: material/robot
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Plus Jakarta Sans
    code: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://miminions.ai
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MiMinions-ai/MiMinions
      name: MiMinions on GitHub

nav:
  - Home: index.md
  - For CLI Users:
      - CLI & Chat: for-use/cli.md
      - Features: for-use/single-agent-use-case.md
  - For Developers:
      - Getting Started: for-dev/getting-started.md
      - Use Cases:
          - Single Agent Use Case: for-dev/use-cases/single-agent-use-case.md
          - Real-estate deal desk: for-dev/use-cases/real-estate-deal-desk.md
      - Modules:
          - Agent: for-dev/modules/agent.md
          - Memory: for-dev/modules/memory.md
          - Context Builder: for-dev/modules/context.md
          - Tools: for-dev/modules/tools.md
          - Workspaces: for-dev/modules/workspaces.md
      - Contributing: for-dev/contributing.md
      - Changelog: for-dev/changelog.md
  - About: about.md
  - FAQ: faq.md
  - Contact: contact.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
