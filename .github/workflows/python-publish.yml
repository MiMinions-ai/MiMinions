# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  # The wheel is py3-none-any, so it is built once. This job instead proves the
  # single artifact installs and runs on every supported OS before it ships.
  verify:
    needs:
      - build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install built wheel with all extras
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1 || { echo "expected exactly one wheel, found: ${wheels[*]}"; exit 1; }
          pip install "${wheels[0]}[all]"

      - name: Smoke test the installed package
        shell: bash
        run: |
          miminions --version
          miminions --help
          python -c "import miminions.agent, miminions.memory.sqlite"

  # Unlike the wheel, the PyInstaller binary is genuinely platform-specific and
  # cannot be cross-built, so this job really does build once per OS.
  cli-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: miminions-cli-linux-x64
          - os: macos-latest
            asset: miminions-cli-macos-arm64
          - os: windows-latest
            asset: miminions-cli-windows-x64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `all` is required, not optional: a standalone-binary user cannot install
      # an extra later, so vector memory must be bundled or it is unreachable.
      - name: Install build dependencies
        run: pip install -e ".[all,cli-build]"

      # Build settings live in miminions-cli.spec, shared with
      # deploy/build_cli.sh. See memory/past/adrs/0008-cli-binary-build-flags.md.
      - name: Build standalone CLI binary
        run: pyinstaller --clean miminions-cli.spec

      - name: Smoke test the binary
        shell: bash
        run: |
          binary=dist/miminions-cli
          [ "$RUNNER_OS" = "Windows" ] && binary=dist/miminions-cli.exe
          "$binary" --version
          # Every group is lazily imported, so --help alone would not catch a
          # missing module.
          for group in agent workspace chat task auth knowledge execution gateway prompt; do
            "$binary" "$group" --help > /dev/null
          done
      - name: Rename binary for release
        shell: bash
        run: |
          source=dist/miminions-cli
          [ "$RUNNER_OS" = "Windows" ] && source=dist/miminions-cli.exe
          mv "$source" "dist/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  attach-binaries:
    needs:
      - cli-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Retrieve CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: miminions-cli-*
          path: binaries/
          merge-multiple: true

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" binaries/* --clobber --repo "${{ github.repository }}"

  publish:
    runs-on: ubuntu-latest
    needs:
      - verify
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/MiMinions/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
