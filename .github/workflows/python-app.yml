# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  # `development` is the integration branch, so gate merges into it without
  # doubling runs on direct pushes.
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e ".[dev,sqlite,docs]"
    - name: Test with pytest
      run: pytest
    - name: Verify build
      run: python -m build
    - name: Lint with ruff
      run: ruff check --statistics src tests
    - name: Build docs
      run: mkdocs build --strict

  execution-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install execution test dependencies
      run: pip install -e ".[dev]"
    - name: Verify local execution lifecycle
      run: python -m pytest tests/unit/test_execution_dispatch.py tests/integration/test_execution_processes.py -q
