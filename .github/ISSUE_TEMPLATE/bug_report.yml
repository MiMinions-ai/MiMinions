name: Bug Report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `miminions ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error output
      description: Any relevant error message or stack trace.
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: MiMinions version, OS, and Python version.
      placeholder: "0.4.1, macOS 15, Python 3.12"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/MiMinions-ai/MiMinions/blob/main/CODE_OF_CONDUCT.md)
          required: true
