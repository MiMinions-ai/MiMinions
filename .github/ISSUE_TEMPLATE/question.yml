name: Question
description: Ask about usage, setup, or behavior
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: For open-ended discussion, consider [Discussions](https://github.com/MiMinions-ai/MiMinions/discussions) instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include what you have already tried, and your version or setup if relevant.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/MiMinions-ai/MiMinions/blob/main/CODE_OF_CONDUCT.md)
          required: true
