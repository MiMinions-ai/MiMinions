name: Feature Request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case behind the request, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. Mention alternatives you considered.
    validations:
      required: true
  - type: checkboxes
    id: implementation
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement this
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/MiMinions-ai/MiMinions/blob/main/CODE_OF_CONDUCT.md)
          required: true
